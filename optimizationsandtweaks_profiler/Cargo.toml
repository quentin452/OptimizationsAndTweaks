[package]
name = "optimizationsandtweaks_profiler"
version = "0.1.0"
edition = "2021"

[lib]
name = "optimizationsandtweaks_profiler"
crate-type = ["rlib"]

[dependencies]
lazy_static = "1.5.0"
optimizationsandtweaks_shared = { path = "../optimizationsandtweaks_shared" }

# Release size trim (no behavior change): strip debug symbols + LTO. Deliberately NOT panic="abort"
# (would break the catch_unwind FFI panic guards) and NOT opt-level="z" (would risk perf on the hot
# native paths). Shrinks the shipped .so/.dll/.dylib on the next cross-OS native build (CI).
[profile.release]
strip = true
lto = true
codegen-units = 1
