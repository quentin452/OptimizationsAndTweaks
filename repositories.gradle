// Add any additional repositories for your dependencies here

repositories {
    mavenCentral()
    // matou-exec (the extracted execution seam, hub doc 28) is published here.
    mavenLocal()
    maven {
        name = "forge"
        url = "https://maven.minecraftforge.net/"
    }
    maven {
        name = "cursemaven"
        url = "https://mvn.falsepattern.com/cursemaven"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "mvnpattern"
        url = "https://mvn.falsepattern.com/releases"
    }
}
